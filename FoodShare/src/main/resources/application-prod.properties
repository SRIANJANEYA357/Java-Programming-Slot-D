# ========================================================
# FoodShare Production Configuration Profile (prod)
# 12-Factor Compliant: Strictly Environment-Variable Driven
# ========================================================

# Cloud Relational Database (Enforce TLS encryption in transit)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema Integrity: auto-update table structures for deployment, overridable to validate via HIBERNATE_DDL_AUTO
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.sql.init.mode=never

# HikariCP Cloud Connection Pool Tuning
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000

# Cryptographic JWT Secret (Mandatory in production)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}

# Production Logging (No debug leakage of tokens, passwords or PII)
logging.level.com.foodshare=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# Container Liveness & Readiness Health Probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
