# Development Profile (In-Memory H2 in MySQL Compatibility Mode)
spring.datasource.url=jdbc:h2:mem:foodsharedb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Disable auto SQL script execution since DataInitializer handles programmatic seeding
spring.sql.init.mode=never

# H2 Console (Restricted to localhost for development security)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Dev-only JWT fallback secret for local testing
app.jwt.secret=${JWT_SECRET:9a67c7689128564f275b22dc136616a9a7a92b2345e54c7b89f2a3456789abcd}
logging.level.com.foodshare=DEBUG
