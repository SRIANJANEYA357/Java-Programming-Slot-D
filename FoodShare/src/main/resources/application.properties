# FoodShare Application Properties
spring.application.name=foodshare
server.port=${PORT:8081}

# Default profile (falls back to dev for local convenience when no profile is explicitly passed)
spring.profiles.default=dev

# SQL Initialization
spring.sql.init.mode=never

# File upload configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration (Must be provided via JWT_SECRET in production)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}

# Logging
logging.level.com.foodshare=INFO
logging.level.org.springframework.security=WARN

# Container Health Probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
